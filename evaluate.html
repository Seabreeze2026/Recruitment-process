<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qiymətləndirmə</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .ev-wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 60px; }
    .ev-head { margin-bottom: 18px; }
    .stars { display: flex; gap: 8px; flex-wrap: wrap; }
    .stars label { flex: 1; min-width: 90px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 6px; text-align: center; cursor: pointer; font-size: 12px; color: var(--ink-2); }
    .stars label b { display: block; font-size: 22px; color: var(--ink); }
    .stars input { display: none; }
    .stars label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #fff; }
    .stars label:has(input:checked) b { color: #fff; }
  </style>
</head>
<body>
  <div class="ev-wrap">
    <div class="brand" style="color:var(--ink);padding:0 0 18px"><div class="brand-mark">İQ</div><div class="brand-name">İşə qəbul<small style="color:var(--ink-3)">Qiymətləndirmə forması</small></div></div>
    <div id="ev" class="card card-pad">Yüklənir…</div>
  </div>
  <script src="assets/config.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/evaluate.js"></script>
</body>
</html>
